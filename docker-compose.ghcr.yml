# Kudos — run from prebuilt GHCR images (no local build).
#
# Pulls the images published by .github/workflows/docker.yml instead of building
# from source. Pin a specific commit by overriding the tag, e.g.
#   WEB_TAG=sha-<commit> SLACK_TAG=sha-<commit> docker compose -f docker-compose.ghcr.yml up
#
# Quick start:
#   1. cp apps/web/.env.local.example .env.docker   # then fill in values
#   2. docker compose -f docker-compose.ghcr.yml run --rm web npm run db:push
#      docker compose -f docker-compose.ghcr.yml run --rm web npm run db:seed
#   3. docker compose -f docker-compose.ghcr.yml up
#
# Images are private until the owner sets the GHCR package visibility to public
# (GitHub -> Packages -> package -> Package settings -> Change visibility). For
# private images, run `docker login ghcr.io` with a token that has read:packages.

services:
  web:
    image: ghcr.io/brandonrc/kudos-bounty-web:${WEB_TAG:-latest}
    pull_policy: always
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "3000:3000"
    volumes:
      - kudos-db:/app/packages/db/prisma
    restart: unless-stopped

  slack:
    image: ghcr.io/brandonrc/kudos-bounty-slack:${SLACK_TAG:-latest}
    pull_policy: always
    env_file:
      - path: .env.docker
        required: false
    volumes:
      - kudos-db:/app/packages/db/prisma
    restart: unless-stopped

  # Optional PostgreSQL backend. Use the -pg web image and the pg init flow:
  #   1. set WEB_TAG=latest-pg and, in .env.docker:
  #        DATABASE_URL=postgresql://kudos:change-me-local-kudos-pw@db:5432/kudos?schema=public
  #   2. docker compose -f docker-compose.ghcr.yml --profile postgres up -d db
  #   3. docker compose -f docker-compose.ghcr.yml run --rm web npm run db:pg:migrate
  #      docker compose -f docker-compose.ghcr.yml run --rm web npm run db:seed
  #   4. docker compose -f docker-compose.ghcr.yml --profile postgres up
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: kudos
      # Placeholder for local use only — CHANGE THIS before exposing Postgres.
      POSTGRES_PASSWORD: change-me-local-kudos-pw
      POSTGRES_DB: kudos
    volumes:
      - kudos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudos -d kudos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kudos-db:
  kudos-pg:
