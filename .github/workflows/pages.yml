name: pages

# Publishes the static showcase in site/ to GitHub Pages.
#
# ONE-TIME REPO SETTING (required before the first deploy succeeds):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Once set, every push to main that touches site/ (or this workflow) redeploys.
# Live at: https://brandonrc.github.io/kudos-bounty/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the deploy job to mint an OIDC token and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight publish finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
