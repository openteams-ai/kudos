# Kudos — web dashboard + Slack bot, one image, two services.
#
# Quick start:
#   1. cp apps/web/.env.local.example .env.docker   # then fill in values
#   2. docker compose build
#   3. docker compose run --rm web npm run db:push   # create tables
#      docker compose run --rm web npm run db:seed   # seed values + rewards
#   4. docker compose up
#
# See docs/docker.md for env details, DB modes, and troubleshooting.

services:
  web:
    build:
      context: .
      target: web
    # Provide your own values here. This file is NOT committed — see
    # apps/web/.env.local.example for the full list of keys. Marked optional so
    # `docker compose config`/`up` still work before you create it.
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "3000:3000"
    volumes:
      # Named volume holds the SQLite db so it survives restarts and is shared
      # with the slack service. Mounted at the Prisma dir because the default
      # (DATABASE_URL unset) resolves to packages/db/prisma/dev.db.
      - kudos-db:/app/packages/db/prisma
    restart: unless-stopped

  slack:
    build:
      context: .
      target: slack
    env_file:
      - path: .env.docker
        required: false
    volumes:
      # Same volume as web -> both containers see the same dev.db file.
      - kudos-db:/app/packages/db/prisma
    restart: unless-stopped

  # Optional PostgreSQL backend. The images must be built with the Postgres
  # Prisma client, and the app pointed at the db service:
  #   1. docker compose build --build-arg DB_PROVIDER=postgres
  #   2. set in .env.docker (match POSTGRES_PASSWORD below):
  #        DATABASE_URL=postgresql://kudos:change-me-local-kudos-pw@db:5432/kudos?schema=public
  #   3. docker compose --profile postgres up -d db
  #   4. docker compose run --rm web npm run db:pg:migrate   # apply migrations
  #      docker compose run --rm web npm run db:seed          # seed data
  #   5. docker compose --profile postgres up
  # (Do NOT use db:push here — that targets the SQLite schema and fails with a
  # provider/URL mismatch. See docs/docker.md.)
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: kudos
      # Placeholder for local use only — CHANGE THIS for anything reachable
      # beyond your machine, and keep DATABASE_URL above in sync.
      POSTGRES_PASSWORD: change-me-local-kudos-pw
      POSTGRES_DB: kudos
    volumes:
      - kudos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudos -d kudos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kudos-db:
  kudos-pg:
